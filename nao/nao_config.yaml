# Configuration documentation:
# https://docs.getnao.io/nao-agent/context-builder/configuration#nao_config-yaml

project_name: rockstat

databases:
  - type: clickhouse
    name: rockstat
    protocol: http
    host: "{{ env('CLICKHOUSE_HOST') }}"
    port: 8443
    secure: true
    database: stats_ui
    user: "{{ env('CLICKHOUSE_USER') }}"
    password: "{{ env('CLICKHOUSE_PASSWORD') }}"
    # Only the UI-facing tables. The raw stats.* tables have hundreds of columns and tens of billions of rows.
    include:
      - "stats_ui.events"
      - "stats_ui.sessions"
      - "stats.vitals"
    exclude:
      - "stats_ui.*_mv"
    allow_listed_only: true
    templates:
      - columns
      - preview

llm:
  providers:
    - provider: openai
      api_key: "{{ env('OPENAI_API_KEY') }}"
      models:
        - id: gpt-5.5
          name: GPT-5.5
          default: true
        - id: gpt-5.4-mini
          name: GPT-5.4 mini

repos: []
